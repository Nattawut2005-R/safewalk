<!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /* ===================================================================
       [SECTION 5: STATE & INITIAL DEMO DATA]
       =================================================================== */
    const RMUTK_CENTER = [13.7136, 100.5385];
    const MERGE_RADIUS_METERS = 25;
    const RESOLVE_HIDE_MS = 5 * 60 * 1000;

    const CATEGORY_META = {
      smoke: {
        label: 'สูบบุหรี่ในพื้นที่ห้ามสูบ',
        badgeClass: 'badge-smoke',
        pinClass: 'pin-smoke',
        circleColor: '#dc2626',
        icon: '🚬'
      },
      dark: {
        label: 'ไฟทางดับ / ทางเดินมืด',
        badgeClass: 'badge-dark',
        pinClass: 'pin-dark',
        circleColor: '#d97706',
        icon: '💡'
      },
      block: {
        label: 'ขายของปิดถนน / ตั้งเต็นท์จัดงาน',
        badgeClass: 'badge-block',
        pinClass: 'pin-block',
        circleColor: '#2563eb',
        icon: '🚧'
      }
    };

    const IOT_SPOTS = [
      { lat: 13.7139, lng: 100.5382, note: 'เซ็นเซอร์ตรวจจับควันบุหรี่จุดทางเดินใกล้อาคารเรียน' },
      { lat: 13.7133, lng: 100.5389, note: 'เซ็นเซอร์ตรวจจับควันบุหรี่จุดลานพักผ่อน / ทางเดินเชื่อม' },
      { lat: 13.7141, lng: 100.5391, note: 'เซ็นเซอร์ตรวจจับควันบุหรี่จุดทางเดินริมรั้วมหาวิทยาลัย' }
    ];

    let hazards = [
      {
        id: 'HZ-101',
        category: 'dark',
        lat: 13.7137,
        lng: 100.5381,
        description: 'ไฟส่องสว่างทางเดินดับ 2 ดวง ช่วงเย็นเดินค่อนข้างมืด',
        imageUrl: '',
        reportCount: 1,
        isIotAlert: false,
        isResolved: false,
        resolvedAt: null,
        createdAt: Date.now() - 12 * 60 * 1000
      },
      {
        id: 'HZ-102',
        category: 'block',
        lat: 13.7134,
        lng: 100.5387,
        description: 'มีการตั้งโต๊ะขายของและเต็นท์ชั่วคราวบริเวณทางเดินเท้า',
        imageUrl: '',
        reportCount: 2,
        isIotAlert: false,
        isResolved: false,
        resolvedAt: null,
        createdAt: Date.now() - 25 * 60 * 1000
      }
    ];

    let pendingCoords = null;
    let pendingImageDataUrl = '';
    let isSidebarOpen = true;
    let iotSpotIndex = 0;

    /* ===================================================================
       [SECTION 6: MAP INIT & GPS LOCATION]
       =================================================================== */
    const map = L.map('map', {
      center: RMUTK_CENTER,
      zoom: 17,
      zoomControl: true
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const markerLayerGroup = L.layerGroup().addTo(map);

    let userBlueDotMarker = null;
    let userAccuracyCircle = null;

    function locateUserOnMap() {
      if (!navigator.geolocation) {
        alert('เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง GPS ครับ');
        return;
      }
      map.locate({ setView: true, maxZoom: 18, watch: false, enableHighAccuracy: true });
    }

    map.on('locationfound', function (e) {
      const radiusMeters = Math.max(e.accuracy || 12, 8);

      if (!userBlueDotMarker) {
        const blueDotIcon = L.divIcon({
          className: '',
          html: '<div class="user-blue-dot"></div>',
          iconSize: [16, 16],
          iconAnchor: [8, 8]
        });

        userBlueDotMarker = L.marker(e.latlng, {
          icon: blueDotIcon,
          zIndexOffset: 900
        })
          .addTo(map)
          .bindPopup('<strong>ตำแหน่งปัจจุบันของคุณ</strong>');

        userAccuracyCircle = L.circle(e.latlng, {
          radius: radiusMeters,
          color: '#2563eb',
          fillColor: '#3b82f6',
          fillOpacity: 0.14,
          weight: 1.5
        }).addTo(map);
      } else {
        userBlueDotMarker.setLatLng(e.latlng);
        userAccuracyCircle.setLatLng(e.latlng).setRadius(radiusMeters);
      }
    });

    map.on('locationerror', function () {
      alert('ไม่สามารถดึงตำแหน่ง GPS ได้ กรุณาเปิดสิทธิ์ Location/GPS บนอุปกรณ์และเบราว์เซอร์ก่อนครับ');
    });

    /* ===================================================================
       [SECTION 7: SPATIAL & LIFECYCLE LOGIC]
       =================================================================== */
    function getDistanceMeters(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = function (deg) { return (deg * Math.PI) / 180; };
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
        Math.sin(dLng / 2) * Math.sin(dLng / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function isHiddenFromMap(hazard) {
      if (!hazard.isResolved || !hazard.resolvedAt) return false;
      return (Date.now() - hazard.resolvedAt) >= RESOLVE_HIDE_MS;
    }

    function formatTimeAgo(timestamp) {
      const diffSec = Math.max(1, Math.floor((Date.now() - timestamp) / 1000));
      if (diffSec < 60) return diffSec + ' วินาทีที่แล้ว';
      const diffMin = Math.floor(diffSec / 60);
      if (diffMin < 60) return diffMin + ' นาทีที่แล้ว';
      const diffHr = Math.floor(diffMin / 60);
      return diffHr + ' ชั่วโมงที่แล้ว';
    }

    function addOrMergeHazard(payload) {
      const category = payload.category;
      const lat = payload.lat;
      const lng = payload.lng;
      const description = payload.description || '';
      const imageUrl = payload.imageUrl || '';
      const isIotAlert = Boolean(payload.isIotAlert);

      const existing = hazards.find(function (item) {
        if (item.isResolved) return false;
        if (item.category !== category) return false;
        const dist = getDistanceMeters(item.lat, item.lng, lat, lng);
        return dist <= MERGE_RADIUS_METERS;
      });

      if (existing) {
        existing.reportCount += 1;
        if (isIotAlert) existing.isIotAlert = true;
        if (description && existing.description.indexOf(description) === -1) {
          existing.description = existing.description + ' | ' + description;
        }
        if (imageUrl && !existing.imageUrl) {
          existing.imageUrl = imageUrl;
        }
        existing.createdAt = Date.now();
        renderAll();
        return existing;
      }

      const newHazard = {
        id: 'HZ-' + Math.floor(100 + Math.random() * 900) + '-' + String(Date.now()).slice(-3),
        category: category,
        lat: lat,
        lng: lng,
        description: description || CATEGORY_META[category].label,
        imageUrl: imageUrl,
        reportCount: 1,
        isIotAlert: isIotAlert,
        isResolved: false,
        resolvedAt: null,
        createdAt: Date.now()
      };

      hazards.unshift(newHazard);
      renderAll();
      return newHazard;
    }

    function markResolved(id) {
      const target = hazards.find(function (h) { return h.id === id; });
      if (!target) return;
      target.isResolved = true;
      target.resolvedAt = Date.now();
      renderAll();
    }

    /* ===================================================================
       [SECTION 8: UI RENDERING & REPORTING]
       =================================================================== */
    function renderMarkers() {
      markerLayerGroup.clearLayers();

      hazards.forEach(function (h) {
        if (isHiddenFromMap(h)) return;

        const meta = CATEGORY_META[h.category];
        const isHighAlert = !h.isResolved && (h.category === 'smoke' || h.isIotAlert || h.reportCount >= 2);
        const pinStyleClass = h.isResolved ? 'pin-done' : (isHighAlert ? 'pin-smoke' : meta.pinClass);
        const circleColor = h.isResolved ? '#16a34a' : (isHighAlert ? '#dc2626' : meta.circleColor);

        L.circle([h.lat, h.lng], {
          radius: MERGE_RADIUS_METERS,
          color: circleColor,
          fillColor: circleColor,
          fillOpacity: h.isResolved ? 0.06 : 0.14,
          weight: 1.5,
          dashArray: h.isResolved ? '4 4' : null
        }).addTo(markerLayerGroup);

        const iconHtml = L.divIcon({
          className: '',
          html: '<div class="pin-marker ' + pinStyleClass + '"><span>' + (h.isResolved ? '✓' : meta.icon) + '</span></div>',
          iconSize: [34, 34],
          iconAnchor: [17, 34],
          popupAnchor: [0, -32]
        });

        const statusText = h.isResolved
          ? 'แก้ไขเสร็จสิ้นแล้ว (จะซ่อนจากแผนที่ใน 5 นาที)'
          : (isHighAlert ? ('แจ้งเตือนสูง (จำนวนแจ้ง: ' + h.reportCount + ' ครั้ง)') : ('กำลังดำเนินการ (จำนวนแจ้ง: ' + h.reportCount + ' ครั้ง)'));

        const imgHtml = h.imageUrl
          ? ('<div style="margin-top:6px;"><img src="' + h.imageUrl + '" alt="รูปประกอบ" style="width:100%;max-height:120px;object-fit:cover;border-radius:6px;" /></div>')
          : '';

        const popupContent =
          '<div style="min-width:190px;font-family:\'Prompt\',sans-serif;">' +
            '<div style="font-weight:700;font-size:0.88rem;margin-bottom:4px;">' + meta.icon + ' ' + meta.label + '</div>' +
            '<div style="font-size:0.78rem;color:#334155;margin-bottom:4px;">' + h.description + '</div>' +
            '<div style="font-size:0.74rem;color:#64748b;">' + statusText + '</div>' +
            imgHtml +
          '</div>';

        const marker = L.marker([h.lat, h.lng], { icon: iconHtml }).addTo(markerLayerGroup);
        marker.bindPopup(popupContent);
      });
    }

    function renderSidebar() {
      const sidebarBody = document.getElementById('sidebarBody');
      const activeItems = hazards.filter(function (h) { return !h.isResolved; });
      const resolvedItems = hazards.filter(function (h) { return h.isResolved; });
      const smokeCount = activeItems.filter(function (h) { return h.category === 'smoke' || h.isIotAlert; }).length;

      document.getElementById('statActive').textContent = activeItems.length;
      document.getElementById('statSmoke').textContent = smokeCount;
      document.getElementById('statResolved').textContent = resolvedItems.length;

      let html = '<div class="section-label">จุดเสี่ยงและแจ้งเตือนที่กำลังดำเนินการ (' + activeItems.length + ')</div>';

      if (activeItems.length === 0) {
        html += '<div class="empty-state">ยังไม่มีจุดเสี่ยงที่กำลังดำเนินการในขณะนี้<br/>คลิกบนแผนที่เพื่อปักหมุดแจ้งเหตุได้ทันที</div>';
      } else {
        activeItems.forEach(function (h) {
          const meta = CATEGORY_META[h.category];
          const isHighAlert = h.category === 'smoke' || h.isIotAlert || h.reportCount >= 2;
          const cardClass = isHighAlert ? 'smoke' : h.category;
          const badgeClass = isHighAlert ? 'badge-smoke' : meta.badgeClass;
          const badgeText = h.isIotAlert
            ? ('IoT ตรวจพบควัน (' + h.reportCount + ')')
            : (h.reportCount >= 2 ? ('แจ้งซ้ำ ' + h.reportCount + ' จุด') : meta.label);

          const imgBlock = h.imageUrl
            ? ('<img src="' + h.imageUrl + '" class="card-img" alt="รูปภาพประกอบเหตุการณ์" />')
            : '';

          html +=
            '<article class="hazard-card ' + cardClass + '" onclick="focusHazard(\'' + h.id + '\')">' +
              '<div class="card-top">' +
                '<div class="card-title">' + meta.icon + ' ' + meta.label + '</div>' +
                '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
              '</div>' +
              '<div class="card-desc">' + h.description + '</div>' +
              imgBlock +
              '<div class="card-meta">' +
                '<span>📍 ' + h.lat.toFixed(5) + ', ' + h.lng.toFixed(5) + '</span>' +
                '<span>🕒 ' + formatTimeAgo(h.createdAt) + '</span>' +
              '</div>' +
              '<div class="card-actions" onclick="event.stopPropagation()">' +
                '<span style="font-size:0.72rem;color:#64748b;">รวมรัศมี ≤ 25 ม.</span>' +
                '<button class="btn btn-resolve" type="button" onclick="markResolved(\'' + h.id + '\')">✓ แก้ไขเสร็จสิ้น</button>' +
              '</div>' +
            '</article>';
        });
      }

      html += '<div class="section-label">รายการที่แก้ไขเสร็จสิ้นแล้ว (' + resolvedItems.length + ')</div>';

      if (resolvedItems.length === 0) {
        html += '<div class="empty-state">ยังไม่มีรายการที่ทำเครื่องหมายว่าแก้ไขเสร็จสิ้น</div>';
      } else {
        resolvedItems.forEach(function (h) {
          const meta = CATEGORY_META[h.category];
          const remainSec = h.resolvedAt
            ? Math.max(0, Math.ceil((RESOLVE_HIDE_MS - (Date.now() - h.resolvedAt)) / 1000))
            : 0;
          const mapNote = remainSec > 0
            ? ('อยู่บนแผนที่อีก ~' + Math.ceil(remainSec / 60) + ' นาที')
            : 'ซ่อนออกจากแผนที่แล้ว';

          html +=
            '<article class="hazard-card resolved" onclick="focusHazard(\'' + h.id + '\')">' +
              '<div class="card-top">' +
                '<div class="card-title">' + meta.icon + ' ' + meta.label + '</div>' +
                '<span class="badge badge-done">แก้ไขเสร็จสิ้นแล้ว</span>' +
              '</div>' +
              '<div class="card-desc">' + h.description + '</div>' +
              '<div class="card-meta">' +
                '<span>' + mapNote + '</span>' +
                '<span>🕒 ' + formatTimeAgo(h.resolvedAt || h.createdAt) + '</span>' +
              '</div>' +
            '</article>';
        });
      }

      sidebarBody.innerHTML = html;
    }

    function renderAll() {
      renderMarkers();
      renderSidebar();
    }

    window.focusHazard = function (id) {
      const target = hazards.find(function (h) { return h.id === id; });
      if (!target) return;
      map.setView([target.lat, target.lng], 18, { animate: true });
    };

    window.markResolved = markResolved;

    const reportModal = document.getElementById('reportModal');
    const pickedCoordsEl = document.getElementById('pickedCoords');
    const imageInput = document.getElementById('hazardImage');
    const imagePreview = document.getElementById('imagePreview');

    function openReportModal(latlng) {
      pendingCoords = latlng;
      pendingImageDataUrl = '';
      imageInput.value = '';
      imagePreview.src = '';
      imagePreview.style.display = 'none';
      document.getElementById('hazardDesc').value = '';
      pickedCoordsEl.textContent = latlng.lat.toFixed(5) + ', ' + latlng.lng.toFixed(5);
      reportModal.classList.add('active');
    }

    function closeReportModal() {
      reportModal.classList.remove('active');
      pendingCoords = null;
    }

    map.on('click', function (e) {
      openReportModal(e.latlng);
    });

    document.getElementById('closeModalBtn').addEventListener('click', closeReportModal);
    document.getElementById('cancelReportBtn').addEventListener('click', closeReportModal);

    imageInput.addEventListener('change', function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) {
        pendingImageDataUrl = '';
        imagePreview.style.display = 'none';
        return;
      }
      const reader = new FileReader();
      reader.onload = function (ev) {
        pendingImageDataUrl = ev.target.result;
        imagePreview.src = pendingImageDataUrl;
        imagePreview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('reportForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!pendingCoords) return;

      const category = document.getElementById('hazardCategory').value;
      const description = document.getElementById('hazardDesc').value.trim();

      const created = addOrMergeHazard({
        category: category,
        lat: pendingCoords.lat,
        lng: pendingCoords.lng,
        description: description,
        imageUrl: pendingImageDataUrl,
        isIotAlert: false
      });

      closeReportModal();
      map.setView([created.lat, created.lng], 18, { animate: true });
    });

    document.getElementById('simIotBtn').addEventListener('click', function () {
      const spot = IOT_SPOTS[iotSpotIndex % IOT_SPOTS.length];
      iotSpotIndex += 1;

      const alertItem = addOrMergeHazard({
        category: 'smoke',
        lat: spot.lat,
        lng: spot.lng,
        description: spot.note + ' (ตรวจพบค่าควัน/ฝุ่นเกินเกณฑ์อัตโนมัติ)',
        imageUrl: '',
        isIotAlert: true
      });

      map.setView([alertItem.lat, alertItem.lng], 18, { animate: true });
    });

    document.getElementById('locateMeBtn').addEventListener('click', locateUserOnMap);

    const sidebarEl = document.getElementById('sidebar');
    const edgeSlideBtn = document.getElementById('edgeSlideBtn');
    const slideArrow = document.getElementById('slideArrow');
    const slideLabel = document.getElementById('slideLabel');

    edgeSlideBtn.addEventListener('click', function () {
      isSidebarOpen = !isSidebarOpen;
      sidebarEl.classList.toggle('collapsed', !isSidebarOpen);
      edgeSlideBtn.setAttribute('aria-expanded', String(isSidebarOpen));

      if (isSidebarOpen) {
        slideArrow.textContent = '▶';
        slideLabel.textContent = 'เลื่อน';
      } else {
        slideArrow.textContent = '◀';
        slideLabel.textContent = 'เปิดรายการ';
      }

      setTimeout(function () {
        map.invalidateSize();
      }, 260);
    });

    setInterval(function () {
      renderAll();
    }, 15000);

    renderAll();
  </script>
