<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RMUTK SafeWalk — หน้าผู้ดูแลระบบ (Admin)</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <link rel="stylesheet" href="eiei.css" />
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    #adminMap {
      width: 100%;
      height: 340px;
      border-radius: 14px;
      border: 1.5px solid var(--border);
      margin-bottom: 10px;
      z-index: 1;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
    }

    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .field-input,
    .field-select {
      width: 100%;
      background: var(--surface-2);
      color: var(--text);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
    }

    @media (max-width: 480px) {
      .form-grid-2 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-card">
      <div class="brand-left">
        <div class="brand-logo">
          <iconify-icon icon="lucide:shield-check" width="18"></iconify-icon>
        </div>
        <div>
          <div class="brand-title">RMUTK SafeWalk Admin</div>
          <div class="brand-sub">มทร.กรุงเทพ · ดูทุกหมุด ปักหมุดช่วงวัน และจัดการรายการ</div>
        </div>
      </div>
      <div class="header-actions">
        <a href="index.html" class="pill-btn">
          <iconify-icon icon="lucide:arrow-left" width="14"></iconify-icon>
          <span>หน้าแผนที่</span>
        </a>
        <button id="themeToggleBtn" class="pill-btn" type="button">
          <iconify-icon id="themeToggleIcon" icon="lucide:moon" width="14"></iconify-icon>
          <span id="themeToggleText">โหมดกลางคืน</span>
        </button>
      </div>
    </div>

    <!-- กล่องแผนที่รวมทุกหมุด + ปักหมุดจุดเสี่ยงและกำหนดช่วงวันแสดงผล -->
    <div class="hazard-card">
      <div class="card-title">
        <iconify-icon icon="lucide:map-pin-plus" width="17"></iconify-icon>
        <span>แผนที่รวมทุกหมุดและปักหมุดกำหนดช่วงวัน</span>
      </div>
      <div class="card-sub" style="margin-top:4px;">
        แสดงหมุดรายการทั้งหมดในฐานข้อมูล และคลิกบนแผนที่เพื่อเลื่อนหมุดตำแหน่งที่จะปักใหม่
      </div>

      <div id="adminMap" style="margin-top:10px;"></div>

      <div class="form-grid-2">
        <div class="field-group" style="margin-top:0;">
          <label class="field-label" for="adminLat">
            <iconify-icon icon="lucide:compass" width="13"></iconify-icon>
            <span>ละติจูด (Lat)</span>
          </label>
          <input id="adminLat" class="field-input" type="number" step="any" value="13.7138" />
        </div>
        <div class="field-group" style="margin-top:0;">
          <label class="field-label" for="adminLng">
            <iconify-icon icon="lucide:compass" width="13"></iconify-icon>
            <span>ลองจิจูด (Lng)</span>
          </label>
          <input id="adminLng" class="field-input" type="number" step="any" value="100.5364" />
        </div>
      </div>

      <div class="form-grid-2">
        <div class="field-group">
          <label class="field-label" for="adminCategory">
            <iconify-icon icon="lucide:tag" width="13"></iconify-icon>
            <span>หมวดหมู่</span>
          </label>
          <select id="adminCategory" class="field-select">
            <option value="smoke">ควันบุหรี่ (สูบบุหรี่ในพื้นที่ห้ามสูบ)</option>
            <option value="dark">ไฟทางดับ (ไฟทางดับ / ทางเดินมืด)</option>
            <option value="block" selected>กีดขวาง (ขายของปิดถนน / ตั้งเต็นท์)</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
        <div class="field-group">
          <label class="field-label" for="adminCode">
            <iconify-icon icon="lucide:hash" width="13"></iconify-icon>
            <span>รหัสอ้างอิง (เว้นว่างเพื่อสร้างอัตโนมัติ)</span>
          </label>
          <input id="adminCode" class="field-input" type="text" placeholder="เช่น HZ-ADM-514245" />
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="adminDesc">
          <iconify-icon icon="lucide:file-text" width="13"></iconify-icon>
          <span>รายละเอียดจุดเสี่ยง</span>
        </label>
        <input id="adminDesc" class="field-input" type="text" placeholder="เช่น ปิด งานลอยกระทง หรือจุดที่พบปัญหา" />
      </div>

      <div class="form-grid-2">
        <div class="field-group">
          <label class="field-label" for="adminStartAt">
            <iconify-icon icon="lucide:calendar-plus" width="13"></iconify-icon>
            <span>ปักหมุดตั้งแต่วันที่ / เวลา</span>
          </label>
          <input id="adminStartAt" class="field-input" type="datetime-local" />
        </div>
        <div class="field-group">
          <label class="field-label" for="adminEndAt">
            <iconify-icon icon="lucide:calendar-x" width="13"></iconify-icon>
            <span>ถึงวันที่ / เวลา</span>
          </label>
          <input id="adminEndAt" class="field-input" type="datetime-local" />
        </div>
      </div>

      <div class="card-actions">
        <button id="saveAdminPinBtn" class="action-btn picked" type="button">
          <iconify-icon icon="lucide:pin" width="14"></iconify-icon>
          <span>บันทึกหมุดลงฐานข้อมูล</span>
        </button>
      </div>
    </div>

    <div class="summary-grid">
      <button id="adminFilterActive" class="summary-card" type="button">
        <div id="adminActiveNum" class="summary-num danger">0</div>
        <div class="summary-label">
          <iconify-icon icon="lucide:alert-circle" width="14"></iconify-icon>
          <span>กำลังดำเนินการ</span>
        </div>
      </button>
      <button id="adminFilterResolved" class="summary-card" type="button">
        <div id="adminResolvedNum" class="summary-num success">0</div>
        <div class="summary-label">
          <iconify-icon icon="lucide:check-circle-2" width="14"></iconify-icon>
          <span>แก้ไขแล้ว</span>
        </div>
      </button>
    </div>

    <div class="filter-scroll" id="adminCategoryBar">
      <button class="cat-chip active" data-category="all" type="button">
        <iconify-icon icon="lucide:layers" width="14"></iconify-icon>
        <span>ทั้งหมด</span>
      </button>
      <button class="cat-chip" data-category="smoke" type="button">
        <iconify-icon icon="lucide:cigarette" width="14"></iconify-icon>
        <span>ควันบุหรี่</span>
      </button>
      <button class="cat-chip" data-category="dark" type="button">
        <iconify-icon icon="lucide:lightbulb-off" width="14"></iconify-icon>
        <span>ไฟทางดับ</span>
      </button>
      <button class="cat-chip" data-category="block" type="button">
        <iconify-icon icon="lucide:construction" width="14"></iconify-icon>
        <span>กีดขวาง</span>
      </button>
      <button class="cat-chip" data-category="other" type="button">
        <iconify-icon icon="lucide:alert-triangle" width="14"></iconify-icon>
        <span>อื่นๆ</span>
      </button>
    </div>

    <div id="adminNotice" class="hazard-card hidden"></div>
    <div id="adminListContainer"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    const CATEGORY_LABELS = {
      smoke: "สูบบุหรี่ในพื้นที่ห้ามสูบ",
      dark: "ไฟทางดับ / ทางเดินมืด",
      block: "ขายของปิดถนน / ตั้งเต็นท์",
      other: "อื่นๆ",
    };

    const CATEGORY_ICONS = {
      smoke: "lucide:cigarette",
      dark: "lucide:lightbulb-off",
      block: "lucide:construction",
      other: "lucide:alert-triangle",
    };

    let adminHazards = [];
    let statusFilter = "all";
    let categoryFilter = "all";
    let adminMap = null;
    let draftMarker = null;
    let adminHazardLayer = null;

    function getDb() {
      return typeof sbClient !== "undefined" && sbClient ? sbClient : null;
    }

    function showAdminNotice(msg, isError = true) {
      const el = document.getElementById("adminNotice");
      if (!el) return;
      if (!msg) {
        el.classList.add("hidden");
        el.innerHTML = "";
        return;
      }
      el.classList.remove("hidden");
      el.innerHTML = `<div class="card-title" style="color:${isError ? "var(--danger)" : "var(--primary)"};">
        <iconify-icon icon="${isError ? "lucide:alert-triangle" : "lucide:check-circle-2"}" width="16"></iconify-icon>
        <span>${msg}</span>
      </div>`;
    }

    function createAdminCategoryIcon(category, isResolved) {
      const catKey = String(category || "").toLowerCase();
      const iconName = CATEGORY_ICONS[catKey] || (isResolved ? "lucide:check" : "lucide:alert-circle");
      const bg = isResolved ? "#16a34a" : "#dc2626";
      return L.divIcon({
        className: "safewalk-custom-pin",
        html: `<div style="
          width:30px;height:30px;border-radius:50%;
          background:${bg};color:#ffffff;
          display:flex;align-items:center;justify-content:center;
          border:2.5px solid #ffffff;box-shadow:0 2px 6px rgba(0,0,0,0.35);
        "><iconify-icon icon="${iconName}" width="15"></iconify-icon></div>`,
        iconSize: [30, 30],
        iconAnchor: [15, 15],
      });
    }

    function getFilteredAdminHazards() {
      return adminHazards.filter((item) => {
        const matchStatus =
          statusFilter === "resolved"
            ? Boolean(item.is_resolved)
            : statusFilter === "active"
            ? !item.is_resolved
            : true;
        const matchCategory =
          categoryFilter === "all" ||
          String(item.category || "").toLowerCase() === categoryFilter;
        return matchStatus && matchCategory;
      });
    }

    function renderAdminMapPins() {
      if (!adminMap || !adminHazardLayer) return;
      adminHazardLayer.clearLayers();

      const items = getFilteredAdminHazards();
      items.forEach((item) => {
        const lat = Number(item.lat);
        const lng = Number(item.lng);
        if (Number.isNaN(lat) || Number.isNaN(lng)) return;

        const catKey = String(item.category || "").toLowerCase();
        const catLabel = CATEGORY_LABELS[catKey] || item.category || "จุดเสี่ยง";
        const isResolved = Boolean(item.is_resolved);

        const m = L.marker([lat, lng], {
          icon: createAdminCategoryIcon(catKey, isResolved),
        });
        m.bindPopup(`
          <strong>${catLabel} (${isResolved ? "แก้ไขแล้ว" : "กำลังดำเนินการ"})</strong><br/>
          <span>${item.description || catLabel}</span><br/>
          <small>รหัส: ${item.id} · ${lat.toFixed(5)}, ${lng.toFixed(5)}</small>
        `);
        adminHazardLayer.addLayer(m);
      });
    }

    function initAdminMap() {
      const mapEl = document.getElementById("adminMap");
      if (!mapEl || !window.L) return;

      const initLat = Number(document.getElementById("adminLat")?.value || 13.7138);
      const initLng = Number(document.getElementById("adminLng")?.value || 100.5364);

      adminMap = L.map("adminMap").setView([initLat, initLng], 16);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "© OpenStreetMap",
      }).addTo(adminMap);

      adminHazardLayer = L.layerGroup().addTo(adminMap);

      draftMarker = L.marker([initLat, initLng], {
        draggable: true,
        zIndexOffset: 900,
      })
        .bindPopup("ตำแหน่งปักหมุดใหม่ (ลากหรือคลิกบนแผนที่เพื่อย้าย)")
        .addTo(adminMap);

      draftMarker.on("dragend", () => {
        const pt = draftMarker.getLatLng();
        document.getElementById("adminLat").value = pt.lat.toFixed(6);
        document.getElementById("adminLng").value = pt.lng.toFixed(6);
      });

      adminMap.on("click", (e) => {
        const { lat, lng } = e.latlng;
        draftMarker.setLatLng([lat, lng]);
        document.getElementById("adminLat").value = lat.toFixed(6);
        document.getElementById("adminLng").value = lng.toFixed(6);
      });

      const now = new Date();
      const plus1Day = new Date(now.getTime() + 24 * 60 * 60 * 1000);
      const toLocalInput = (d) => {
        const pad = (n) => String(n).padStart(2, "0");
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
      };
      const startInput = document.getElementById("adminStartAt");
      const endInput = document.getElementById("adminEndAt");
      if (startInput && !startInput.value) startInput.value = toLocalInput(now);
      if (endInput && !endInput.value) endInput.value = toLocalInput(plus1Day);
    }

    async function createAdminHazard() {
      const db = getDb();
      if (!db) {
        showAdminNotice("ไม่พบการเชื่อมต่อ sbClient จาก supabase-config.js");
        return;
      }

      const lat = Number(document.getElementById("adminLat")?.value);
      const lng = Number(document.getElementById("adminLng")?.value);
      const category = document.getElementById("adminCategory")?.value || "other";
      const description = (document.getElementById("adminDesc")?.value || "").trim();
      const customId = (document.getElementById("adminCode")?.value || "").trim();
      const startRaw = document.getElementById("adminStartAt")?.value;
      const endRaw = document.getElementById("adminEndAt")?.value;

      if (Number.isNaN(lat) || Number.isNaN(lng)) {
        showAdminNotice("กรุณาเลือกหรือกรอกพิกัดละติจูด/ลองจิจูดให้ถูกต้อง");
        return;
      }

      const randomCode = "HZ-ADM-" + Math.floor(100000 + Math.random() * 900000);
      const payload = {
        id: customId || randomCode,
        category,
        lat,
        lng,
        description: description || CATEGORY_LABELS[category] || category,
        is_resolved: false,
        created_by_admin: true,
        resolved_votes: 0,
        unresolved_votes: 0,
      };

      if (startRaw) {
        payload.start_at = new Date(startRaw).toISOString();
      }
      if (endRaw) {
        payload.end_at = new Date(endRaw).toISOString();
      }

      const { error } = await db.from("hazards").insert(payload);
      if (error) {
        showAdminNotice(`บันทึกหมุดไม่สำเร็จ: ${error.message} (code: ${error.code || "-"})`);
        return;
      }

      showAdminNotice(`ปักหมุดรหัส ${payload.id} เรียบร้อยแล้ว`, false);
      document.getElementById("adminDesc").value = "";
      document.getElementById("adminCode").value = "";
      await loadAdminHazards();
    }

    function updateAdminCounts() {
      const activeCount = adminHazards.filter((h) => !h.is_resolved).length;
      const resolvedCount = adminHazards.filter((h) => h.is_resolved).length;

      document.getElementById("adminActiveNum").textContent = activeCount;
      document.getElementById("adminResolvedNum").textContent = resolvedCount;

      document
        .getElementById("adminFilterActive")
        ?.classList.toggle("selected", statusFilter === "active");
      document
        .getElementById("adminFilterResolved")
        ?.classList.toggle("selected", statusFilter === "resolved");
    }

    function renderAdminList() {
      const container = document.getElementById("adminListContainer");
      if (!container) return;

      const filtered = getFilteredAdminHazards();
      if (filtered.length === 0) {
        container.innerHTML = `<div class="hazard-card"><div class="card-sub">ไม่มีรายการจุดเสี่ยงตามตัวกรองที่เลือก</div></div>`;
        return;
      }

      container.innerHTML = filtered
        .map((item) => {
          const catKey = String(item.category || "").toLowerCase();
          const catIcon = CATEGORY_ICONS[catKey] || "lucide:alert-circle";
          const isResolved = Boolean(item.is_resolved);
          const unresVotes = Number(item.unresolved_votes ?? 0);
          const resVotes = Number(item.resolved_votes ?? 0);
          const createdStr = item.created_at
            ? new Date(item.created_at).toLocaleString("th-TH")
            : "-";
          const windowText =
            item.start_at || item.end_at
              ? `ช่วงเวลา: ${item.start_at ? new Date(item.start_at).toLocaleString("th-TH") : "-"} ถึง ${item.end_at ? new Date(item.end_at).toLocaleString("th-TH") : "-"}`
              : "";

          return `
            <div class="hazard-card">
              <div class="card-top">
                <div class="card-title">
                  <iconify-icon icon="${catIcon}" width="16"></iconify-icon>
                  <span>${CATEGORY_LABELS[catKey] || item.category || "จุดเสี่ยง"}</span>
                </div>
                <span class="status-tag ${isResolved ? "resolved" : "unresolved"}">
                  <iconify-icon icon="${isResolved ? "lucide:check-circle-2" : "lucide:clock"}" width="12"></iconify-icon>
                  <span>${isResolved ? "แก้ไขแล้ว" : "กำลังดำเนินการ"}</span>
                </span>
              </div>
              <div>${item.description || ""}</div>
              ${windowText ? `<div class="card-sub" style="margin-top:4px;">${windowText}</div>` : ""}
              <div class="card-meta">
                <span>
                  <iconify-icon icon="lucide:map-pin" width="12"></iconify-icon>
                  ${Number(item.lat).toFixed(5)}, ${Number(item.lng).toFixed(5)}
                </span>
                <span>
                  <iconify-icon icon="lucide:calendar" width="12"></iconify-icon>
                  ${createdStr}
                </span>
                <span>
                  <iconify-icon icon="lucide:hash" width="12"></iconify-icon>
                  ${item.id}
                </span>
              </div>
              <div class="vote-status-note">
                <iconify-icon icon="lucide:bar-chart-2" width="14"></iconify-icon>
                <span>ผลโหวต: ยังไม่แก้ไข ${unresVotes} · แก้ไขแล้ว ${resVotes}</span>
              </div>
              <div class="card-actions">
                <button
                  class="action-btn ${isResolved ? "" : "picked"}"
                  type="button"
                  onclick="toggleHazardStatus('${item.id}', ${!isResolved})"
                >
                  <iconify-icon icon="${isResolved ? "lucide:rotate-ccw" : "lucide:check-circle-2"}" width="13"></iconify-icon>
                  <span>${isResolved ? "เปิดเป็นกำลังดำเนินการ" : "ยืนยันว่าแก้ไขแล้ว"}</span>
                </button>
                <button
                  class="action-btn danger-btn"
                  type="button"
                  onclick="deleteHazard('${item.id}')"
                >
                  <iconify-icon icon="lucide:trash-2" width="13"></iconify-icon>
                  <span>ลบรายการ</span>
                </button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    async function loadAdminHazards() {
      const db = getDb();
      if (!db) {
        showAdminNotice("ไม่พบการเชื่อมต่อ sbClient จาก supabase-config.js");
        return;
      }

      const { data, error } = await db
        .from("hazards")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        showAdminNotice(`โหลดข้อมูลไม่สำเร็จ: ${error.message}`);
        return;
      }

      showAdminNotice("");
      adminHazards = Array.isArray(data) ? data : [];
      updateAdminCounts();
      renderAdminMapPins();
      renderAdminList();
    }

    async function toggleHazardStatus(id, markResolved) {
      const db = getDb();
      if (!db) return;

      const nowIso = markResolved ? new Date().toISOString() : null;
      const { error } = await db
        .from("hazards")
        .update({
          is_resolved: markResolved,
          resolved_decided_at: nowIso,
        })
        .eq("id", id);

      if (error) {
        showAdminNotice(`อัปเดตสถานะไม่สำเร็จ: ${error.message} (code: ${error.code || "-"})`);
        return;
      }

      showAdminNotice(
        markResolved ? `อัปเดตรหัส ${id} เป็น "แก้ไขแล้ว" เรียบร้อย` : `เปิดสถานะรหัส ${id} เป็น "กำลังดำเนินการ" แล้ว`,
        false
      );
      await loadAdminHazards();
    }

    async function deleteHazard(id) {
      if (!confirm(`ต้องการลบรายการรหัส ${id} ออกจากฐานข้อมูลใช่หรือไม่?`)) return;
      const db = getDb();
      if (!db) return;

      const { error } = await db.from("hazards").delete().eq("id", id);
      if (error) {
        showAdminNotice(`ลบรายการไม่สำเร็จ: ${error.message} (code: ${error.code || "-"})`);
        return;
      }

      showAdminNotice(`ลบรายการ ${id} เรียบร้อยแล้ว`, false);
      await loadAdminHazards();
    }

    document.getElementById("saveAdminPinBtn")?.addEventListener("click", createAdminHazard);

    document.getElementById("adminFilterActive")?.addEventListener("click", () => {
      statusFilter = statusFilter === "active" ? "all" : "active";
      updateAdminCounts();
      renderAdminMapPins();
      renderAdminList();
    });

    document.getElementById("adminFilterResolved")?.addEventListener("click", () => {
      statusFilter = statusFilter === "resolved" ? "all" : "resolved";
      updateAdminCounts();
      renderAdminMapPins();
      renderAdminList();
    });

    document.querySelectorAll("#adminCategoryBar .cat-chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        document
          .querySelectorAll("#adminCategoryBar .cat-chip")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        categoryFilter = btn.dataset.category || "all";
        renderAdminMapPins();
        renderAdminList();
      });
    });

    document.getElementById("themeToggleBtn")?.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      const iconEl = document.getElementById("themeToggleIcon");
      const textEl = document.getElementById("themeToggleText");
      if (iconEl) iconEl.setAttribute("icon", isDark ? "lucide:sun" : "lucide:moon");
      if (textEl) textEl.textContent = isDark ? "โหมดสว่าง" : "โหมดกลางคืน";
    });

    initAdminMap();
    loadAdminHazards();
  </script>
</body>
</html>
